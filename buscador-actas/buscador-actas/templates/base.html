<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscador de Actas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <nav class="navbar bg-primary navbar-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{{ url_for('index') }}">Buscador de Actas</a>
      <span class="navbar-text text-white-50 small d-none d-sm-inline">Facultad Interdisciplinaria de Ingeniería · Unison</span>
    </div>
  </nav>
  <main class="container pb-5" style="max-width: 900px;">
    {% block content %}{% endblock %}
  </main>
  <footer class="container text-center text-muted small pb-4">
    {{ docs_indexados }} acta(s) indexada(s)
  </footer>
</body>
</html>
